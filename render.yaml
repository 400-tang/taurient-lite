# Render 的 Blueprint 配置：https://render.com/docs/blueprint-spec
#
# 在 Render 后台选「New +」→「Blueprint」，连上这个仓库，它会读这个文件
# 自动建好服务，不需要在网页上手动填 build/start command。
#
# 根目录保持在仓库根（默认），这样 backend/server.py 里
# `from taurient_lite import ...` 才能正常找到包——taurient_lite/
# 就在仓库根目录下，跟 backend/ 是平级目录。

services:
  - type: web
    name: taurient-lite-backend
    runtime: python
    # Python 版本锁在仓库根目录的 .python-version 里，不写在这。
    #
    # **Blueprint 没有 pythonVersion 这个字段**——写了不会报错，会被静默
    # 忽略，然后服务继续用 Render 当时的默认版本（2026-09 是 3.14.3）。
    # 这个坑踩过一次：以为锁上了，线上 /health 报出来还是 3.14。
    # Render 只认 PYTHON_VERSION 环境变量和 .python-version 文件两种方式，
    # 后者顺带被本地 pyenv 和 GitHub Actions 读，三个环境共用一个来源。
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
